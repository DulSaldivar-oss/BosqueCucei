# Producción en la máquina de Oracle:  ./scripts/desplegar.sh   (o docker compose up -d --build)
# Desarrollo local (solo la base):     docker compose up -d db
name: bosque-cucei

# Rota los registros para que no llenen el disco de la máquina.
x-registros: &registros
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *registros
    environment:
      POSTGRES_USER: bosque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bosque}
      POSTGRES_DB: bosque
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde la propia máquina (nunca expuesta a internet).
    # Si el 5432 ya está ocupado (otro PostgreSQL), usa otro: PUERTO_DB=5433 en .env
    ports:
      - "127.0.0.1:${PUERTO_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosque -d bosque"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica migraciones y semillas pendientes en cada arranque, antes que la app.
  migrar:
    build:
      context: .
      target: herramientas
    <<: *registros
    environment:
      DATABASE_URL: postgres://bosque:${POSTGRES_PASSWORD:-bosque}@db:5432/bosque
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["app"]

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    <<: *registros
    environment:
      DATABASE_URL: postgres://bosque:${POSTGRES_PASSWORD:-bosque}@db:5432/bosque
      URL_SITIO: https://${DOMINIO:-localhost}
      TZ: America/Mexico_City
    volumes:
      - fotos:/datos/fotos
    depends_on:
      db:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    profiles: ["app"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *registros
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
  fotos:
  caddy_datos:
  caddy_config:
