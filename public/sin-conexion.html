<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d5a3d" />
    <title>Sin conexión · Bosque CUCEI</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f1e7;
        color: #1e2b22;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 12px 30px -12px rgb(30 43 34 / 0.45); }
      h1 { margin: 20px 0 8px; font-size: 1.6rem; line-height: 1.15; }
      p { margin: 0 0 24px; color: #56645a; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        background: #2d5a3d;
        color: #fffcf6;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .hoja { display: inline-block; animation: caer 3s ease-in-out infinite; }
      @keyframes caer { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(6px) rotate(8deg); } }
      @media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icono-192.png" alt="" />
      <h1>Sin conexión <span class="hoja" aria-hidden="true">🍃</span></h1>
      <p>No hay internet en este momento. Tus árboles siguen ahí: vuelve a intentarlo cuando tengas señal.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
